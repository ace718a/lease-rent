name: Update News Index Automatically

on:
  push:
    paths:
      - 'public/news/**.html' # 경로 수정 완료

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run auto-update script
        run: |
          cd public/news          # 경로 수정 완료
          python auto_update.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/news/news-data.json # 경로 수정 완료
          git diff --quiet && git diff --staged --quiet || git commit -m "Update news index [skip ci]"
          git push
